<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Investment Calculator</title>
  </head>

  <body>
    <h1>Investment Calculator</h1>
    <p>Use this to calculate the future value of your investment</p>

    <div>
      <label id="principleLabel" for="principleInput">$1000</label>
      <input id="principleInput" type="range" value="1000" min="100" max="10000" step="100">
    </div>

    <div>
      <label id="yearsLabel" for="yearsInput">20 Years</label>
      <input id="yearsInput" type="number"  value="20" min="1" max="50">
    </div>

    <div>
      <p id="fvOutput"></p>
    </div>

    <script>

      const principleInput = document.getElementById('principleInput');
      const principleLabel = document.getElementById('principleLabel');

      const yearsInput = document.getElementById('yearsInput');
      const yearsLabel = document.getElementById('yearsLabel');

      const fvOutput = document.getElementById('fvOutput');

      let principle = 1000;
      let years = 20;

      updateScreen(futureValue(principle, years));

      principleInput.addEventListener("input", function() {
        principle = principleInput.value;
        principleLabel.innerHTML = "$" + principle;
        updateScreen(futureValue(principle, years));
      });

      yearsInput.addEventListener("input", function() {
        years = yearsInput.value;
        yearsLabel.innerHTML = years + " Years";
        updateScreen(futureValue(principle, years));

      });

      function futureValue(p, y) {
        let fv = p * Math.pow(1 + 0.08, y);
        return Math.round(fv);
      }

      function updateScreen(fv) {
        fvOutput.textContent = "At 8% interest, in " + years + " years your $" + principle + " will grow to $" + fv;
      }

    </script>
  </body>
</html>
